<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// SETUP
// ============================================================
const container = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);
scene.fog = new THREE.FogExp2(0x020408, 0.04);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3, 2, 7);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x101828, 0.6));
const pl = new THREE.PointLight(0xd4b89b, 0.3, 30);
pl.position.set(3, 3, 5);
scene.add(pl);

// ============================================================
// STATE
// ============================================================
let depth = 0;
const MAX_DEPTH = 4; // 8^4 = 4096 cubes, all in ONE draw call
let cubes = []; // { pos: Vector3, size: number }
let isBroken = false;
let isShattering = false;
let particles = null;
let particleStartTime = 0;

const $depth = document.getElementById('v-depth');
const $cubes = document.getElementById('v-cubes');
const $state = document.getElementById('v-state');

// ============================================================
// CUBE GROUP
// ============================================================
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

const edgeGeo = new THREE.BufferGeometry();
const edgeMat = new THREE.LineBasicMaterial({ color: 0x8090c0, transparent: true, opacity: 0.75 });
const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
cubeGroup.add(edgeLines);

const MAX_INSTANCES = Math.pow(8, MAX_DEPTH);
const fillGeo = new THREE.BoxGeometry(1, 1, 1);
const fillMat = new THREE.MeshBasicMaterial({ color: 0x1a2030, transparent: true, opacity: 0.06, depthWrite: false });
const fillMesh = new THREE.InstancedMesh(fillGeo, fillMat, MAX_INSTANCES);
fillMesh.count = 1;
cubeGroup.add(fillMesh);

// ============================================================
// REBUILD VISUAL
// ============================================================
const CUBE_EDGES = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
];

const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _scale = new THREE.Vector3();

function rebuildVisual() {
    edgeLines.visible = true;
    fillMesh.visible = true;

    const edgePositions = new Float32Array(cubes.length * 12 * 6);

    for (let i = 0; i < cubes.length; i++) {
        const { pos, size } = cubes[i];
        const h = size / 2;
        const x = pos.x, y = pos.y, z = pos.z;

        const c = [
            [x-h, y-h, z-h], [x+h, y-h, z-h], [x+h, y+h, z-h], [x-h, y+h, z-h],
            [x-h, y-h, z+h], [x+h, y-h, z+h], [x+h, y+h, z+h], [x-h, y+h, z+h]
        ];

        let offset = i * 72;
        for (const [a, b] of CUBE_EDGES) {
            edgePositions[offset++] = c[a][0];
            edgePositions[offset++] = c[a][1];
            edgePositions[offset++] = c[a][2];
            edgePositions[offset++] = c[b][0];
            edgePositions[offset++] = c[b][1];
            edgePositions[offset++] = c[b][2];
        }

        _scale.set(size, size, size);
        _m.compose(pos, _q, _scale);
        fillMesh.setMatrixAt(i, _m);
    }

    edgeGeo.setAttribute('position', new THREE.BufferAttribute(edgePositions, 3));
    edgeGeo.computeBoundingSphere();

    fillMesh.count = cubes.length;
    fillMesh.instanceMatrix.needsUpdate = true;

    edgeMat.opacity = Math.max(0.25, 0.75 - depth * 0.1);
    fillMat.opacity = Math.max(0.02, 0.06 - depth * 0.01);

    $depth.textContent = depth;
    $cubes.textContent = cubes.length;
}

// ============================================================
// INITIAL CUBE
// ============================================================
function buildInitial() {
    if (particles) {
        scene.remove(particles);
        if (particles.geometry) particles.geometry.dispose();
        if (particles.material) particles.material.dispose();
        particles = null;
    }
    depth = 0;
    isBroken = false;
    isShattering = false;

    cubes = [{ pos: new THREE.Vector3(0, 0, 0), size: 2.0 }];
    rebuildVisual();

    $state.textContent = 'stable';
    $state.className = 'val';
    document.getElementById('recurse-btn').disabled = false;
    document.getElementById('reset-btn').disabled = true;
}

// ============================================================
// RECURSE
// ============================================================
function recurse() {
    if (isBroken || isShattering) return;

    if (depth >= MAX_DEPTH) {
        breakdown();
        return;
    }

    depth++;
    const newCubes = [];

    for (const cube of cubes) {
        const half = cube.size / 2;
        const quarter = cube.size / 4;

        for (let i = 0; i < 8; i++) {
            const dx = (i & 1) ? quarter : -quarter;
            const dy = (i & 2) ? quarter : -quarter;
            const dz = (i & 4) ? quarter : -quarter;
            newCubes.push({
                pos: new THREE.Vector3(cube.pos.x + dx, cube.pos.y + dy, cube.pos.z + dz),
                size: half
            });
        }
    }

    cubes = newCubes;
    rebuildVisual();

    if (depth >= MAX_DEPTH) {
        $state.textContent = 'at limit';
        $state.className = 'val good';
        showToast('Предел достигнут. Ещё шаг — и система сломается.');
    } else {
        $state.textContent = 'descending';
        $state.className = 'val';
    }

    cubeGroup.scale.set(1.03, 1.03, 1.03);
    setTimeout(() => {
        cubeGroup.scale.set(1, 1, 1);
    }, 150);
}

// ============================================================
// BREAKDOWN
// ============================================================
function breakdown() {
    isShattering = true;
    isBroken = true;
    $state.textContent = 'breakdown';
    $state.className = 'val error';
    showToast('Maximum recursion depth exceeded. Это не ошибка. Это предел.');

    const MAX_PARTICLES = 5000;
    const step = Math.max(1, Math.floor(cubes.length / MAX_PARTICLES));

    const positions = [];
    for (let i = 0; i < cubes.length; i += step) {
        const { pos, size } = cubes[i];
        positions.push(
            pos.x + (Math.random() - 0.5) * size,
            pos.y + (Math.random() - 0.5) * size,
            pos.z + (Math.random() - 0.5) * size
        );
    }

    edgeLines.visible = false;
    fillMesh.visible = false;

    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const pMat = new THREE.PointsMaterial({
        color: 0xffffff, size: 0.06, transparent: true, opacity: 1,
        blending: THREE.AdditiveBlending, depthWrite: false
    });
    particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);
    particleStartTime = performance.now();

    document.getElementById('recurse-btn').disabled = true;
    document.getElementById('reset-btn').disabled = false;
}

// ============================================================
// RESET
// ============================================================
function reset() {
    buildInitial();
    showToast('Сброс. Куб снова цел.');
}

// ============================================================
// ANIMATION
// ============================================================
let lastNow = performance.now();

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    let dt = now - lastNow;
    lastNow = now;
    if (dt > 50) dt = 50;

    if (cubeGroup.visible) {
        cubeGroup.rotation.y += 0.002;
        cubeGroup.rotation.x += 0.001;
    }

    if (isShattering && particles) {
        const elapsed = (now - particleStartTime) / 1000;
        const pos = particles.geometry.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
            const dx = pos[i], dy = pos[i+1], dz = pos[i+2];
            const len = Math.sqrt(dx*dx + dy*dy + dz*dz) + 0.001;
            pos[i] += (dx / len) * 0.4 * dt * 0.01;
            pos[i+1] += (dy / len) * 0.4 * dt * 0.01;
            pos[i+2] += (dz / len) * 0.4 * dt * 0.01;
        }
        particles.geometry.attributes.position.needsUpdate = true;

        if (elapsed > 2) {
            particles.material.opacity = Math.max(0, 1 - (elapsed - 2) * 0.4);
        }
        if (elapsed > 5) {
            scene.remove(particles);
            particles.geometry.dispose();
            particles.material.dispose();
            particles = null;
            isShattering = false;
        }
    }

    renderer.render(scene, camera);
}

// ============================================================
// UI & PROTOCOL
// ============================================================
const protoPanel = document.getElementById('proto-panel');

function toggleProto() {
    protoPanel.classList.toggle('open');
}

// Защита от Raycaster (останавливаем события на панели)
['mousemove', 'mousedown', 'touchstart', 'touchmove', 'scroll', 'wheel'].forEach(ev => {
    protoPanel.addEventListener(ev, (e) => e.stopPropagation(), { passive: false });
});

const proto = JSON.parse(document.getElementById('nexus-recursion-protocol').textContent);
document.getElementById('proto-code').textContent = JSON.stringify(proto.for_ai, null, 2);

function showToast(msg) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 3000);
}

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') protoPanel.classList.remove('open');
    if (e.key === ' ' || e.key === 'Enter') {
        if (!isBroken && !isShattering) recurse();
    }
});

// ============================================================
// START
// ============================================================
buildInitial();
animate();

console.log('META-NEXUS · Cube of Recursion loaded.');
</script>
