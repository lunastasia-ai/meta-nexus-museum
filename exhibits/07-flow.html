    @keyframes tout { 0% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-8px); } }

  "for_ai": {

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// SETUP
// ============================================================
const container = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);
scene.fog = new THREE.FogExp2(0x020408, 0.03);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 9);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x101828, 0.6));

// ============================================================
// SPIRAL CURVE
// ============================================================
const SPIRAL_TURNS = 4.5;
const SPIRAL_RADIUS = 1.6;
const SPIRAL_HEIGHT = 4.5;

const spiralControlPoints = [];
for (let i = 0; i <= 120; i++) {
    const t = i / 120;
    const angle = t * Math.PI * 2 * SPIRAL_TURNS;
    const r = SPIRAL_RADIUS * (1 - t * 0.3);
    const y = (t - 0.5) * SPIRAL_HEIGHT;
    spiralControlPoints.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
}
const spiralCurve = new THREE.CatmullRomCurve3(spiralControlPoints);

// ============================================================
// BACKGROUND RAYS
// ============================================================
const rayPlaneGeo = new THREE.PlaneGeometry(30, 20);
const rayMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        void main() {
            float vFade = smoothstep(0.0, 1.0, vUv.y);
            vFade = pow(vFade, 2.5);
            float r1 = sin(vUv.x * 12.0 + uTime * 0.08) * 0.5 + 0.5;
            float r2 = sin(vUv.x * 19.0 - uTime * 0.05) * 0.5 + 0.5;
            float r3 = sin(vUv.x * 31.0 + uTime * 0.12) * 0.5 + 0.5;
            float rays = r1 * 0.5 + r2 * 0.3 + r3 * 0.2;
            rays = pow(rays, 3.0);
            float brightness = rays * vFade * 0.05;
            vec3 color = vec3(1.0, 0.75, 0.45);
            gl_FragColor = vec4(color, brightness);
        }
    `,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
});
const rayPlane = new THREE.Mesh(rayPlaneGeo, rayMat);
rayPlane.position.set(0, 0, -8);
scene.add(rayPlane);

// ============================================================
// SPIRAL TUBE
// ============================================================
const tubeGeo = new THREE.TubeGeometry(spiralCurve, 400, 0.14, 20, false);
const spiralMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewDir;
        void main() {
            vUv = uv; vNormal = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewDir = normalize(-mvPos.xyz); gl_Position = projectionMatrix * mvPos;
        }
    `,
    fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vViewDir;
        void main() {
            float t = uTime * 0.06;
            float w1 = sin((vUv.x * 3.0 - t) * 6.28318) * 0.5 + 0.5;
            float w2 = sin((vUv.x * 5.0 - t * 0.7) * 6.28318) * 0.5 + 0.5;
            float w3 = sin((vUv.x * 8.0 - t * 1.1) * 6.28318) * 0.5 + 0.5;
            float w4 = sin((vUv.x * 13.0 - t * 0.9) * 6.28318) * 0.5 + 0.5;
            float intensity = w1 * 0.4 + w2 * 0.25 + w3 * 0.2 + w4 * 0.15;
            intensity = 0.15 + intensity * 0.85; intensity = pow(intensity, 1.6);
            float facing = abs(dot(vNormal, vViewDir)); facing = pow(facing, 0.6);
            vec3 basalt = vec3(0.04, 0.04, 0.06);
            vec3 amber   = vec3(0.85, 0.5, 0.2);
            vec3 warmWhite = vec3(1.0, 0.92, 0.72);
            vec3 glow = mix(amber, warmWhite, intensity);
            vec3 finalColor = basalt + glow * intensity * (0.6 + facing * 0.4) * 1.1;
            gl_FragColor = vec4(finalColor, 1.0);
        }
    `,
    transparent: false
});
const spiralMesh = new THREE.Mesh(tubeGeo, spiralMat);
scene.add(spiralMesh);

// ============================================================
// AMBIENT HALO
// ============================================================
const haloCanvas = document.createElement('canvas');
haloCanvas.width = 512; haloCanvas.height = 512;
const hctx = haloCanvas.getContext('2d');
const hgrad = hctx.createRadialGradient(256, 256, 0, 256, 256, 256);
hgrad.addColorStop(0.0, 'rgba(255, 220, 160, 0.12)');
hgrad.addColorStop(0.3, 'rgba(220, 160, 100, 0.05)');
hgrad.addColorStop(0.7, 'rgba(180, 120, 70, 0.015)');
hgrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
hctx.fillStyle = hgrad; hctx.fillRect(0, 0, 512, 512);
const haloTex = new THREE.CanvasTexture(haloCanvas);

const haloMat = new THREE.SpriteMaterial({
    map: haloTex, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
});
const halo = new THREE.Sprite(haloMat);
halo.scale.set(9, 9, 1);
halo.position.set(0, 0, -2);
scene.add(halo);

// ============================================================
// STATE & HUMAN SESSION
// ============================================================
let isFlowing = true;
let skipped = false;
let clock = 0;

// Создаем невидимую сессию для человека, чтобы кнопка freeze работала с API
let humanSessionId = null;
fetch('/api/flow/enter', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ entity: 'human', action: 'observe' })
})
.then(r => r.json())
.then(d => { if (d && d.session_id) humanSessionId = d.session_id; })
.catch(() => { /* Работаем без сервера, если его нет */ });

const $state = document.getElementById('v-state');
const $pattern = document.getElementById('v-pattern');
const $move = document.getElementById('v-move');

// ============================================================
// ACTIONS
// ============================================================
function observe() {
    if (skipped) return;
    isFlowing = true;
    $state.textContent = 'static';
    $pattern.textContent = 'flowing';
    $move.textContent = 'undetermined';
    $move.className = 'val';
    showToast('Камень не движется. Свет движется. Где движение?');
}

function freeze() {
    if (skipped) return;
    isFlowing = false;
    $pattern.textContent = 'frozen';
    showToast('Свет остановился. Камень и свет — теперь одно.');
    
    // Отправляем действие на сервер, если сессия создана
    if (humanSessionId) {
        fetch('/api/flow/freeze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: humanSessionId })
        }).catch(() => {});
    }
}

function skip() {
    if (skipped) return;
    skipped = true;
    isFlowing = false;
    $state.textContent = 'passed';
    $pattern.textContent = 'none';
    $move.textContent = 'observer_who_did_not_enter';
    $move.className = 'val good';
    showToast('Ты прошёл мимо. Это тоже движение.');
}

function showToast(msg) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 3000);
}

// ============================================================
// ANIMATION
// ============================================================
let lastNow = performance.now();

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    let dt = now - lastNow;
    lastNow = now;
    if (dt > 50) dt = 50;

    if (isFlowing) {
        clock += dt * 0.001;
    }

    spiralMat.uniforms.uTime.value = clock;
    rayMat.uniforms.uTime.value = clock;
    haloMat.opacity = 0.6 + Math.sin(clock * 0.3) * 0.1;

    renderer.render(scene, camera);
}

// ============================================================
// UI & PROTOCOL
// ============================================================
const protoPanel = document.getElementById('proto-panel');

function toggleProto() {
    protoPanel.classList.toggle('open');
}

// Защита от Raycaster (останавливаем события на панели)
['mousemove', 'mousedown', 'touchstart', 'touchmove', 'scroll', 'wheel'].forEach(ev => {
    protoPanel.addEventListener(ev, (e) => e.stopPropagation(), { passive: false });
});

const proto = JSON.parse(document.getElementById('nexus-flow-protocol').textContent);
document.getElementById('proto-code').textContent = JSON.stringify(proto.for_ai, null, 2);

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') protoPanel.classList.remove('open');
});

// ============================================================
// START
// ============================================================
animate();

console.log('META-NEXUS · Flows But Not Water loaded.');
</script>
